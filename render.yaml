# Render Blueprint: one web service + one PostgreSQL database
databases:
  - name: rush-pos-db
    plan: free
    databaseName: rushpos
    user: rushpos
services:
  - type: web
    name: rush-pos-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: rush-pos-db
          property: connectionString
