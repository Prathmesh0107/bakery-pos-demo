<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Rush Counter POS — Concept Demo (database)</title>
<style>
:root{--bg:#fff8f2;--sf:#fff;--tx:#2b2a2c;--mu:#6e6a6d;--pk:#c2255c;--pl:#fde4ec;--bd:#eadfd8;--ok:#1e8e4e;--wn:#b36b00;--er:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a1b;--sf:#272425;--tx:#f4efed;--mu:#b2aaad;--pk:#ff7aa8;--pl:#3b2430;--bd:#3a3536;--ok:#5fd08a;--wn:#ffb84d;--er:#ff8787;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1c1a1b;--sf:#272425;--tx:#f4efed;--mu:#b2aaad;--pk:#ff7aa8;--pl:#3b2430;--bd:#3a3536;--ok:#5fd08a;--wn:#ffb84d;--er:#ff8787;color-scheme:dark}
html,body{height:100%}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:10px 14px;min-height:46px}
button,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}
.pri{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700}:root[data-theme=dark] .pri,.pri{color:#fff}
input,select{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
#top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
#top b.n{font-size:18px}.badge{background:var(--pl);color:var(--pk);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px}
.st{display:flex;gap:14px;margin-left:auto;font-size:14px;color:var(--mu)}.st b{color:var(--tx);font-size:17px}
nav{display:flex;gap:6px;width:100%}nav button{flex:1}nav .on{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700}
@media(min-width:900px){nav{width:auto}nav button{flex:none}}
main{padding:14px 16px 90px;max-width:1300px;margin:auto}
.rush{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.chips button{white-space:nowrap;border-radius:99px}.chips .on{background:var(--pk);color:#fff;border-color:var(--pk)}
h3{margin:12px 0 6px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{text-align:left;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.card b{font-size:15px}.card span{color:var(--pk);font-weight:800;font-size:18px}.card small{color:var(--mu)}.card.off{opacity:.5;background:var(--bg)}
.cart{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;position:sticky;top:110px}
.ln{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.qc{display:flex;align-items:center;gap:8px}.qc button{width:46px;padding:0;font-size:22px}.qc b{min-width:26px;text-align:center;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.tot{font-size:26px;font-weight:800;margin:10px 0}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.acts button{font-size:13px;padding:8px 4px}
.mbar{display:none}.x{display:none}
@media(max-width:860px){.rush{grid-template-columns:1fr}
.cart{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:82vh;overflow:auto;z-index:20;border-radius:18px 18px 0 0;transform:translateY(110%);transition:transform .15s;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.cart.open{transform:none}.x{display:block}
.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--bd)}.mbar button{flex:1}}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kp div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px}.kp b{font-size:24px;display:block}
.low{color:var(--wn);font-weight:700}.bad{color:var(--er)}.mu{color:var(--mu)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#md.on{display:flex}.box{background:var(--sf);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.pm .on{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700}
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#2b2a2c;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;display:none;font-weight:600}#tt.er{background:var(--er);color:#fff}
#rcpt{width:58mm;max-width:100%;margin:0 auto;background:#fff;color:#000;font:12px/1.35 monospace;padding:6px}#rcpt table td{padding:1px 0;border:0;color:#000}.c{text-align:center}.r{text-align:right}
#sh{padding:10px 12px}.shb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.shb .on{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700}.dev{border:12px solid #1f1d1e;border-radius:38px;overflow:hidden;background:#1f1d1e;box-shadow:0 12px 40px rgba(0,0,0,.35)}
footer{text-align:center;color:var(--mu);font-size:12px;padding:10px 16px 20px}footer button{min-height:36px;font-size:12px}
@media print{body *{visibility:hidden}#rcpt,#rcpt *{visibility:visible}#rcpt{position:absolute;left:0;top:0;width:58mm;padding:0}@page{size:58mm auto;margin:2mm}}
</style></head><body>
<header id="top"></header><main id="v"></main>
<footer>Independent concept demo — not an official Monginis product, no Monginis approval implied. All prices, stock and sales are sample data you can change.<br><button onclick="resetDemo()">Reset Demo Data</button></footer>
<div id="md"><div class="box" id="mb"></div></div><div id="tt"></div>
<script>
const CATS=['Cakes','Pastries','Puffs & Savouries','Bread & Bakery','Cookies & Chocolates','Candles & Birthday Accessories'],LOW=5;
const FR=document.body.dataset.f==='1',SRC=FR?'':'<!DOCTYPE html>'+document.documentElement.outerHTML.replace('<body','<body data-f="1"');
let S={products:[],sales:[]},ck=null;
let view='rush',cat='All',q='',cart=[],hist=[],pay='Cash',recv='',busy=false,dsel='',iq='',ic='All';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),M=n=>'₹'+Number(n).toLocaleString('en-IN'),P=id=>S.products.find(p=>p.id==id),dk=t=>new Date(t).toLocaleDateString('en-CA');
async function api(p,o={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const r=await fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o,signal:controller.signal});let j=null;try{j=await r.json()}catch(e){}if(!r.ok){const er=new Error(j&&typeof j.detail=='string'?j.detail:'Please check the values and try again');er.status=r.status;throw er}return j}catch(e){if(e.name==='AbortError'){const er=new Error('No confirmation received within 30 seconds. Your bill is still here; retry the same sale safely.');er.timeout=true;throw er}throw e}finally{clearTimeout(timer)}}
async function load(){try{S=await api('/state')}catch(e){toast('Cannot reach server - check connection',1)}}
let tm;function toast(m,e){const t=$('tt');t.textContent=m;t.className=e?'er':'';t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',1800)}
function modal(h){$('mb').innerHTML=h;$('md').classList.add('on')}function closeM(){if(busy)return;$('md').classList.remove('on')}
function ask(msg,fn){window._fn=fn;modal(`<p><b>${msg}</b></p><div class="row"><button onclick="closeM()" style="flex:1">Cancel</button><button class="pri" style="flex:1" onclick="closeM();_fn()">Yes, continue</button></div>`)}
const total=()=>cart.reduce((a,l)=>a+P(l.id).price*l.q,0),count=()=>cart.reduce((a,l)=>a+l.q,0),snap=()=>{hist.push(JSON.stringify(cart));if(hist.length>30)hist.shift()};
function add(id){const p=P(id);if(!p.on||p.stock<=0)return toast(p.name+' is unavailable',1);const l=cart.find(x=>x.id==id);if(l&&l.q>=p.stock)return toast('Only '+p.stock+' in stock',1);snap();l?l.q++:cart.push({id,q:1});rc();toast('Added '+p.name)}
function chg(id,d){const p=P(id),l=cart.find(x=>x.id==id);if(d>0&&l.q>=p.stock)return toast('Only '+p.stock+' in stock',1);snap();l.q+=d;if(l.q<=0)cart=cart.filter(x=>x.id!=id);rc()}
function rm(id){snap();cart=cart.filter(x=>x.id!=id);rc()}
function undo(){if(!hist.length)return toast('Nothing to undo',1);cart=JSON.parse(hist.pop());rc();toast('Undone')}
function clr(){if(cart.length)ask('Clear the whole bill?',()=>{snap();cart=[];rc()})}
function rep(){const l=S.sales[S.sales.length-1];if(!l)return toast('No previous bill yet',1);const go=()=>{snap();cart=[];l.items.forEach(i=>{const p=P(i.id);if(p&&p.on&&p.stock>0)cart.push({id:i.id,q:Math.min(i.q,p.stock)})});rc();toast('Loaded '+l.no+' — edit before payment')};cart.length?ask('Replace current bill with the last bill?',go):go()}
function rc(){cartR();top_();$('mbc')&&($('mbc').textContent=count()+' items · '+M(total()))}
function top_(){const d=dk(Date.now()),s=S.sales.filter(x=>dk(x.t)==d);$('top').innerHTML=`<b class="n">🍰 Sweet Counter <span class="mu" style="font-weight:400;font-size:13px">concept demo</span></b><span class="badge">⚡ Rush Mode ON</span><span id="clk" class="mu"></span><div class="st"><span>Today<br><b>${M(s.reduce((a,x)=>a+x.total,0))}</b></span><span>Bills<br><b>${s.length}</b></span></div><nav>${[['rush','Rush Mode'],['inv','Inventory'],['sales','Sales Summary']].map(n=>`<button class="${view==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav>`;tick()}
function tick(){const c=$('clk');if(c)c.textContent=new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}setInterval(tick,15000);
function go(v){view=v;render()}
function recent(){const m={};S.sales.slice(-30).forEach(s=>s.items.forEach(i=>m[i.id]=(m[i.id]||0)+i.q));return Object.keys(m).sort((a,b)=>m[b]-m[a]).map(P).filter(p=>p&&p.on&&p.stock>0).slice(0,6)}
const card=p=>`<button class="card ${p.on&&p.stock>0?'':'off'}" onclick="add(${p.id})"><b>${esc(p.name)}</b><span>${M(p.price)}</span><small>${!p.on?'Unavailable':p.stock<=0?'Out of stock':p.stock<=LOW?'<span class=low style="font-size:13px">Only '+p.stock+' left</span>':p.stock+' in stock'}</small></button>`;
function match(){const s=q.trim().toLowerCase();return S.products.filter(p=>(cat=='All'||p.cat==cat)&&p.name.toLowerCase().includes(s))}
function prodR(){const m=match(),r=recent();$('cats').innerHTML=['All',...CATS].map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${c.replace(/'/g,"\\'")}';prodR();">${esc(c)}</button>`).join('');$('rec').innerHTML=r.length&&!q?`<h3>Frequently sold</h3><div class="grid">${r.map(card).join('')}</div><h3>All products</h3>`:'';$('grid').innerHTML=m.length?m.map(card).join(''):'<p class="mu">No products match. Try another word or category.</p>'}
function cartR(){const c=$('cart');if(!c)return;const lines=cart.map(l=>{const p=P(l.id);return`<div class="ln"><div><b>${esc(p.name)}</b><div class="mu">${M(p.price)} each</div></div><div class="r"><b>${M(p.price*l.q)}</b></div><div class="qc"><button onclick="chg(${l.id},-1)">−</button><b>${l.q}</b><button onclick="chg(${l.id},1)">+</button></div><button onclick="rm(${l.id})" style="justify-self:end;min-height:40px">✕ Remove</button></div>`}).join('');
c.innerHTML=`<div class="row"><b style="font-size:18px">Current bill</b><button class="x" onclick="$('cart').classList.remove('open')">Hide</button></div>${lines||'<p class="mu">Bill is empty. Tap a product to add it.</p>'}<div class="row mu" style="margin-top:8px"><span>Items</span><b>${count()}</b></div><div class="row mu"><span>Subtotal</span><b>${M(total())}</b></div><div class="row tot"><span>Total</span><span>${M(total())}</span></div><button class="pri" style="width:100%;font-size:19px;min-height:56px" ${cart.length?'':'disabled'} onclick="checkout()">Take Payment</button><div class="acts"><button onclick="undo()">↩ Undo</button><button onclick="rep()">🔁 Repeat last</button><button onclick="clr()">Clear</button></div>`}
function checkout(){if(!cart.length||busy)return;pay='Cash';recv='';$('cart').classList.remove('open');ckR()}
function ckR(){const t=total();modal(`<h2 style="margin:0">Checkout</h2><div class="tot">${M(t)}</div><div class="pm">${['Cash','UPI','Card'].map(m=>`<button class="${pay==m?'on':''}" onclick="pay='${m}';ckR()">${m}</button>`).join('')}</div>${pay=='Cash'?`<label class="mu">Amount received (optional)</label><input id="rv" type="number" min="0" inputmode="decimal" value="${recv}" oninput="recv=this.value;chd()"><p id="chg" class="tot" style="font-size:20px"></p>`:`<p class="mu">Demo only: records "${pay}" as the payment method. No real payment is processed.</p>`}<div class="row"><button id="ckBack" onclick="closeM()" style="flex:1">Back</button><button class="pri" id="cs" style="flex:2" onclick="complete()">Complete Sale</button></div>`);chd()}
function chd(){const e=$('chg');if(!e)return;const d=Number(recv)-total();e.innerHTML=recv===''?'':d<0?`<span class="bad">Short by ${M(-d)}</span>`:`Change: ${M(d)}`}
function applyProduct(p){const i=S.products.findIndex(x=>x.id===p.id);if(i<0)S.products.push(p);else S.products[i]=p;cart=cart.map(l=>({id:l.id,q:Math.min(l.q,(P(l.id)||{stock:0}).stock)})).filter(l=>P(l.id)&&P(l.id).on&&l.q>0)}
async function refreshProducts(){S.products=await api('/products');cart=cart.map(l=>({id:l.id,q:Math.min(l.q,(P(l.id)||{stock:0}).stock)})).filter(l=>P(l.id)&&P(l.id).on&&l.q>0)}
async function complete(){if(busy)return;if(pay=='Cash'&&recv!==''&&Number(recv)<total())return toast('Cash received is less than total',1);
const sig=JSON.stringify(cart)+pay+(pay=='Cash'&&recv!==''?':'+recv:'');if(!ck||ck.sig!=sig)ck={sig,k:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())};
const btn=$('cs');if(!btn)return;busy=true;btn.disabled=true;btn.textContent='Processing…';const back=$('ckBack');if(back)back.disabled=true;$('mb').querySelectorAll('.pm button,input').forEach(el=>el.disabled=true);
const waitHint=setTimeout(()=>{const current=$('cs');if(busy&&current)current.textContent='Still confirming…'},7000);
try{const s=await api('/sales',{method:'POST',body:JSON.stringify({key:ck.k,items:cart.map(l=>({id:l.id,q:l.q})),pay,recv:pay=='Cash'&&recv!==''?Number(recv):null})});if(!s||!s.no)throw new Error('The server response was incomplete. Retry this same bill so duplicate-sale protection can confirm the result.');
if(s.stocks)for(const [id,stock] of Object.entries(s.stocks)){const p=P(Number(id));if(p)p.stock=Number(stock)}
if(!S.sales.some(x=>x.no===s.no)){const {stocks,...savedSale}=s;S.sales.push(savedSale)}
ck=null;busy=false;cart=[];hist=[];rc();prodR();rcpt(s)}
catch(e){busy=false;if($('cs')){$('cs').disabled=false;$('cs').textContent='Retry Sale'}if($('ckBack'))$('ckBack').disabled=false;$('mb').querySelectorAll('.pm button,input').forEach(el=>el.disabled=false);toast(e.timeout?e.message:e.message,1);if(e.status===409){try{await refreshProducts();prodR();rc();ckR()}catch(refreshError){toast('Stock changed. Refresh the page before retrying.',1)}}}
finally{clearTimeout(waitHint)}}
function rcpt(s){const d=new Date(s.t);modal(`<div id="rcpt"><div class="c"><b>SWEET COUNTER</b><br>Concept demo — not official</div><div>Bill: ${s.no}<br>${d.toLocaleDateString('en-IN')} ${d.toLocaleTimeString('en-IN')}</div><hr><table>${s.items.map(i=>`<tr><td colspan="3">${esc(i.name)}</td></tr><tr><td>${i.q} x ${i.price}</td><td></td><td class="r">${i.q*i.price}</td></tr>`).join('')}</table><hr><div class="row"><b>TOTAL</b><b>Rs ${s.total}</b></div><div>Paid by: ${s.pay}${s.recv!=null?`<br>Received ${s.recv} · Change ${s.recv-s.total}`:''}</div><hr><div class="c">Thank you! Please visit again.</div></div><p class="mu c" style="color:var(--ok);font-weight:700">✔ Demo sale recorded (${s.pay})</p><div class="row"><button style="flex:1" onclick="window.print()">🖨 Print Receipt</button><button class="pri" style="flex:1" onclick="closeM()">Next Customer</button></div>`)}
function render(){top_();const v=$('v');if(view=='rush'){v.innerHTML=`<div class="rush"><section><input id="q" placeholder="🔍 Search product — Enter adds the first match" value="${esc(q)}" autocomplete="off"><div class="chips" id="cats"></div><div id="rec"></div><div class="grid" id="grid"></div></section><aside class="cart" id="cart"></aside></div><div class="mbar"><button class="pri" id="mbc" onclick="$('cart').classList.add('open')"></button></div>`;$('q').oninput=e=>{q=e.target.value;prodR()};$('q').onkeydown=e=>{if(e.key=='Enter'){const m=match().find(p=>p.on&&p.stock>0);m?add(m.id):toast('No available match',1);}};prodR();rc()}
else if(view=='inv')invR();else salesR()}
function invR(){const s=iq.toLowerCase(),l=S.products.filter(p=>(ic=='All'||p.cat==ic)&&p.name.toLowerCase().includes(s));$('v').innerHTML=`<div class="panel"><div class="row" style="flex-wrap:wrap"><input id="iq" style="flex:2;min-width:160px" placeholder="Search inventory" value="${esc(iq)}"><select id="ic" style="flex:1;min-width:140px">${['All',...CATS].map(c=>`<option ${c==ic?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="pri" onclick="edit(0)">+ Add product</button></div></div><div class="panel" style="overflow-x:auto"><table><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>${l.map(p=>`<tr><td>${esc(p.name)}</td><td class="mu">${esc(p.cat)}</td><td>${M(p.price)}</td><td class="${p.stock<=LOW?'low':''}">${p.stock}${p.stock<=LOW&&p.stock>0?' ⚠ low':p.stock<=0?' ⚠ out':''}</td><td><button onclick="tog(${p.id})">${p.on?'Available':'Unavailable'}</button></td><td><button onclick="edit(${p.id})">Edit</button></td></tr>`).join('')||'<tr><td colspan="6" class="mu">No products found.</td></tr>'}</table></div>`;
$('iq').oninput=e=>{iq=e.target.value;const p=e.target.selectionStart;invR();$('iq').focus();$('iq').setSelectionRange(p,p)};$('ic').onchange=e=>{ic=e.target.value;invR()}}
async function tog(id){const p=P(id);try{const saved=await api('/products/'+id,{method:'PUT',body:JSON.stringify({name:p.name,cat:p.cat,price:p.price,stock:p.stock,on:!p.on})});applyProduct(saved);invR();top_();rc();toast(saved.name+(saved.on?' available':' unavailable'))}catch(e){toast(e.message,1)}}
function edit(id){const p=id?P(id):{name:'',cat:CATS[0],price:'',stock:'',on:true};modal(`<h2 style="margin:0 0 10px">${id?'Edit':'Add'} product</h2><label class="mu">Name</label><input id="en" value="${esc(p.name)}"><label class="mu">Category</label><select id="ec">${CATS.map(c=>`<option ${c==p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><label class="mu">Price (₹)</label><input id="ep" type="number" min="0" value="${p.price}"><label class="mu">Stock</label><input id="es" type="number" min="0" step="1" value="${p.stock}"><label><input type="checkbox" id="eo" style="width:auto;min-height:0" ${p.on?'checked':''}> Available for sale</label><p id="er" class="bad"></p><div class="row"><button style="flex:1" onclick="closeM()">Cancel</button><button class="pri" style="flex:1" onclick="saveP(${id})">Save</button></div>`)}
async function saveP(id){const n=$('en').value.trim(),pr=Number($('ep').value),st=Number($('es').value),e=$('er');if(!n)return e.textContent='Enter a product name.';if($('ep').value===''||!Number.isInteger(pr)||pr<0)return e.textContent='Price must be a whole number of rupees, 0 or more.';if($('es').value===''||!Number.isInteger(st)||st<0)return e.textContent='Stock must be a whole number, 0 or more.';
try{const saved=await api(id?'/products/'+id:'/products',{method:id?'PUT':'POST',body:JSON.stringify({name:n,cat:$('ec').value,price:pr,stock:st,on:$('eo').checked})});applyProduct(saved);closeM();invR();top_();rc();toast('Product saved')}catch(x){e.textContent=x.message}}
function salesR(){const d=dsel||dk(Date.now()),s=S.sales.filter(x=>dk(x.t)==d),t=s.reduce((a,x)=>a+x.total,0),pm={Cash:0,UPI:0,Card:0},tp={};s.forEach(x=>{pm[x.pay]+=x.total;x.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.q)});const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5);
